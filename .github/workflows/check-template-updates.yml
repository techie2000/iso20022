name: Check Template Updates

on:
  workflow_dispatch:
    inputs:
      template_repo:
        description: 'Source template repository (owner/repo)'
        default: ''
        required: false
        type: string
      template_ref:
        description: 'Template branch or tag to compare against'
        default: ''
        required: false
        type: string
      baseline_ref:
        description: 'Optional baseline template ref/SHA used for 3-way analysis'
        default: ''
        required: false
        type: string
      comparison_exclude_paths:
        description: 'Comma-separated repo-relative files/folders to skip in comparison'
        default: ''
        required: false
        type: string
      generate_ai_suggestions:
        description: 'Attempt AI suggestions for manual-conflict files (advisory only)'
        default: false
        required: false
        type: boolean
      ai_model:
        description: 'Model to use when AI suggestions are enabled'
        default: 'gpt-4.1-mini'
        required: false
        type: string
      create_sync_pr:
        description: 'Create or update a draft PR for safe-adopt and auto-merge candidates'
        default: false
        required: false
        type: boolean
      create_issue:
        description: 'Create or update a tracking issue with findings'
        default: true
        required: false
        type: boolean
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: '0 9 * * 1'

permissions:
  contents: read
  issues: write
  models: read

jobs:
  check-template-updates:
    runs-on: ubuntu-latest
    outputs:
      template_repo: ${{ steps.config.outputs.template_repo }}
      template_ref: ${{ steps.config.outputs.template_ref }}
      baseline_ref: ${{ steps.config.outputs.baseline_ref }}
      has_pr_candidates: ${{ steps.compare.outputs.has_pr_candidates }}
      new_files_json: ${{ steps.compare.outputs.new_files_json }}
      safe_adopt_files_json: ${{ steps.compare.outputs.safe_adopt_files_json }}
      auto_merge_files_json: ${{ steps.compare.outputs.auto_merge_files_json }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: current

      - name: Resolve template comparison configuration
        id: config
        run: |
          set -euo pipefail

          DEFAULT_TEMPLATE_REPO="techie2000/template-docs"
          DEFAULT_TEMPLATE_REF="main"
          INPUT_TEMPLATE_REPO="${{ inputs.template_repo || '' }}"
          INPUT_TEMPLATE_REF="${{ inputs.template_ref || '' }}"
          INPUT_BASELINE_REF="${{ inputs.baseline_ref || '' }}"
          INPUT_COMPARISON_EXCLUDE_PATHS="${{ inputs.comparison_exclude_paths || '' }}"

          TEMPLATE_REPO="${DEFAULT_TEMPLATE_REPO}"
          TEMPLATE_REF="${DEFAULT_TEMPLATE_REF}"

          if [ -n "${INPUT_TEMPLATE_REPO}" ]; then
            TEMPLATE_REPO="${INPUT_TEMPLATE_REPO}"
          fi

          if [ -n "${INPUT_TEMPLATE_REF}" ]; then
            TEMPLATE_REF="${INPUT_TEMPLATE_REF}"
          fi

          BASELINE_REF=""
          BASELINE_SOURCE="none"
          COMPARISON_EXCLUDE_PATHS="${INPUT_COMPARISON_EXCLUDE_PATHS}"
          METADATA_FILE="current/.github/template-sync.yml"

          if [ -n "${INPUT_BASELINE_REF}" ]; then
            BASELINE_REF="${INPUT_BASELINE_REF}"
            BASELINE_SOURCE="workflow_input"
          fi

          if [ -f "${METADATA_FILE}" ]; then
            # Parse minimal key/value YAML (single-line scalar values only).
            if [ -z "${BASELINE_REF}" ]; then
              METADATA_BASELINE_REF="$(sed -nE 's/^[[:space:]]*baseline_ref:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "${METADATA_FILE}" | head -n 1 | xargs || true)"
              if [ -n "${METADATA_BASELINE_REF}" ]; then
                BASELINE_REF="${METADATA_BASELINE_REF}"
                BASELINE_SOURCE="metadata_file"
              fi
            fi

            if [ -z "${INPUT_TEMPLATE_REPO}" ]; then
              METADATA_TEMPLATE_REPO="$(sed -nE 's/^[[:space:]]*template_repo:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "${METADATA_FILE}" | head -n 1 | xargs || true)"
              if [ -n "${METADATA_TEMPLATE_REPO}" ]; then
                TEMPLATE_REPO="${METADATA_TEMPLATE_REPO}"
              fi
            fi

            if [ -z "${INPUT_TEMPLATE_REF}" ]; then
              METADATA_TEMPLATE_REF="$(sed -nE 's/^[[:space:]]*template_ref:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "${METADATA_FILE}" | head -n 1 | xargs || true)"
              if [ -n "${METADATA_TEMPLATE_REF}" ]; then
                TEMPLATE_REF="${METADATA_TEMPLATE_REF}"
              fi
            fi

            if [ -z "${COMPARISON_EXCLUDE_PATHS}" ]; then
              METADATA_EXCLUDE_PATHS="$(sed -nE 's/^[[:space:]]*comparison_exclude_paths:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "${METADATA_FILE}" | head -n 1 | xargs || true)"
              if [ -n "${METADATA_EXCLUDE_PATHS}" ]; then
                COMPARISON_EXCLUDE_PATHS="${METADATA_EXCLUDE_PATHS}"
              fi
            fi
          fi

          {
            echo "template_repo=${TEMPLATE_REPO}"
            echo "template_ref=${TEMPLATE_REF}"
            echo "baseline_ref=${BASELINE_REF}"
            echo "baseline_source=${BASELINE_SOURCE}"
            echo "comparison_exclude_paths=${COMPARISON_EXCLUDE_PATHS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout template repository
        uses: actions/checkout@v7
        env:
          TEMPLATE_SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        with:
          repository: ${{ steps.config.outputs.template_repo }}
          ref: ${{ steps.config.outputs.template_ref }}
          fetch-depth: 0
          path: template
          token: ${{ env.TEMPLATE_SYNC_TOKEN != '' && env.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: Compare with template and generate report
        id: compare
        run: |
          set -euo pipefail

          TEMPLATE_DIR="template"
          CURRENT_DIR="current"
          REPORT_FILE="${RUNNER_TEMP}/template-drift-report.md"
          TEMPLATE_REPO="${{ steps.config.outputs.template_repo }}"
          TEMPLATE_REF="${{ steps.config.outputs.template_ref }}"
          BASELINE_REF="${{ steps.config.outputs.baseline_ref }}"
          BASELINE_SOURCE="${{ steps.config.outputs.baseline_source }}"
          COMPARISON_EXCLUDE_PATHS="${{ steps.config.outputs.comparison_exclude_paths }}"

          # Infrastructure paths that consuming repos should keep in sync with
          # the template. Content paths such as docs/, README.md, package.json,
          # and product-specific files remain intentionally excluded.
          SYNC_PATHS=(
            ".github/copilot-instructions.md"
            ".github/dependabot.yml"
            ".github/instructions"
            ".github/ISSUE_TEMPLATE"
            ".github/pull_request_template.md"
            ".github/workflows"
            ".githooks"
            ".gitignore"
            ".gitattributes"
            ".markdownlint-cli2.yaml"
            ".markdownlint.yaml"
            ".markdownlintignore"
            "AGENTS.md"
            "Makefile"
            ".vscode"
            "docs/internal"
            "scripts"
          )

          NEW_FILES=()
          SNAPSHOT_CHANGED_FILES=()
          SAFE_ADOPT_FILES=()
          AUTO_MERGE_FILES=()
          CONFLICT_FILES=()
          LOCAL_DIVERGENCE_FILES=()
          NEEDS_REBASELINE_FILES=()

          is_excluded_path() {
            local rel="$1"
            local exclude_list="$2"
            local normalized_rel="$rel"

            normalized_rel="${normalized_rel#/}"

            IFS=',' read -r -a EXCLUDED_PATHS <<< "${exclude_list}"
            for exclude_path in "${EXCLUDED_PATHS[@]}"; do
              exclude_path="$(printf '%s' "${exclude_path}" | xargs || true)"
              exclude_path="${exclude_path#/}"
              exclude_path="${exclude_path%/}"

              if [ -z "${exclude_path}" ]; then
                continue
              fi

              case "${normalized_rel}" in
                "${exclude_path}"|"${exclude_path}"/*)
                  return 0
                  ;;
              esac
            done

            return 1
          }

          has_template_object_ref() {
            local rel="$1"
            git -C "${TEMPLATE_DIR}" cat-file -e "${BASELINE_REF}:${rel}" >/dev/null 2>&1
          }

          read_template_object_to_file() {
            local rel="$1"
            local target="$2"
            git -C "${TEMPLATE_DIR}" show -- "${BASELINE_REF}:${rel}" > "${target}"
          }

          classify_with_baseline() {
            local rel="$1"
            local local_file="$2"
            local upstream_file="$3"

            if [ -z "${BASELINE_REF}" ]; then
              SNAPSHOT_CHANGED_FILES+=("${rel}")
              return 0
            fi

            if ! has_template_object_ref "${rel}"; then
              NEEDS_REBASELINE_FILES+=("${rel}")
              return 0
            fi

            local base_tmp
            base_tmp="$(mktemp)"
            read_template_object_to_file "${rel}" "${base_tmp}"

            local local_eq_base="false"
            local upstream_eq_base="false"

            if cmp -s "${local_file}" "${base_tmp}"; then
              local_eq_base="true"
            fi

            if cmp -s "${upstream_file}" "${base_tmp}"; then
              upstream_eq_base="true"
            fi

            if [ "${local_eq_base}" = "true" ] && [ "${upstream_eq_base}" = "false" ]; then
              SAFE_ADOPT_FILES+=("${rel}")
              rm -f "${base_tmp}"
              return 0
            fi

            if [ "${local_eq_base}" = "false" ] && [ "${upstream_eq_base}" = "true" ]; then
              LOCAL_DIVERGENCE_FILES+=("${rel}")
              rm -f "${base_tmp}"
              return 0
            fi

            local merge_probe
            merge_probe="$(mktemp)"

            if git merge-file -p "${local_file}" "${base_tmp}" "${upstream_file}" > "${merge_probe}"; then
              AUTO_MERGE_FILES+=("${rel}")
            else
              CONFLICT_FILES+=("${rel}")
            fi

            rm -f "${base_tmp}" "${merge_probe}"
          }

          for sync_path in "${SYNC_PATHS[@]}"; do
            template_target="${TEMPLATE_DIR}/${sync_path}"
            if [ -d "${template_target}" ]; then
              while IFS= read -r -d '' template_file; do
                relative="${template_file#${TEMPLATE_DIR}/}"
                if is_excluded_path "${relative}" "${COMPARISON_EXCLUDE_PATHS}"; then
                  continue
                fi
                current_file="${CURRENT_DIR}/${relative}"
                if [ ! -f "${current_file}" ]; then
                  NEW_FILES+=("${relative}")
                elif ! diff -q "${current_file}" "${template_file}" > /dev/null 2>&1; then
                  classify_with_baseline "${relative}" "${current_file}" "${template_file}"
                fi
              done < <(find "${template_target}" -type f -print0 | sort -z)
            elif [ -f "${template_target}" ]; then
              current_file="${CURRENT_DIR}/${sync_path}"
              if is_excluded_path "${sync_path}" "${COMPARISON_EXCLUDE_PATHS}"; then
                continue
              fi
              if [ ! -f "${current_file}" ]; then
                NEW_FILES+=("${sync_path}")
              elif ! diff -q "${current_file}" "${template_target}" > /dev/null 2>&1; then
                classify_with_baseline "${sync_path}" "${current_file}" "${template_target}"
              fi
            fi
          done

          TOTAL_DIFFS=$((
            ${#NEW_FILES[@]} +
            ${#SNAPSHOT_CHANGED_FILES[@]} +
            ${#SAFE_ADOPT_FILES[@]} +
            ${#AUTO_MERGE_FILES[@]} +
            ${#CONFLICT_FILES[@]} +
            ${#LOCAL_DIVERGENCE_FILES[@]} +
            ${#NEEDS_REBASELINE_FILES[@]}
          ))

          if [ "${TOTAL_DIFFS}" -eq 0 ]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No differences found. This repository is up-to-date with the template."
            exit 0
          fi

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          CHECK_DATE="$(date -u '+%Y-%m-%d')"

          {
            echo "## Template Drift Report — ${CHECK_DATE}"
            echo ""
            echo "Compared against: [\`${TEMPLATE_REPO}\`](https://github.com/${TEMPLATE_REPO}/tree/${TEMPLATE_REF}) @ \`${TEMPLATE_REF}\`"
            echo ""
            if [ -n "${BASELINE_REF}" ]; then
              echo "Baseline: \`${BASELINE_REF}\` (source: ${BASELINE_SOURCE})"
            else
              echo "Baseline: _not configured_ (falling back to snapshot-only comparison)"
              echo "Set \`.github/template-sync.yml\` -> \`baseline_ref\` (or pass \`baseline_ref\` input) to enable 3-way classification."
            fi
            echo ""
            echo "> [!NOTE]"
            echo "> This report is **advisory only**. Review each difference and decide"
            echo "> whether to incorporate the change. Do **not** blindly copy files from"
            echo "> the template without understanding the impact on this repository."
            echo ""

            if [ "${#NEW_FILES[@]}" -gt 0 ]; then
              echo "### New Files in Template"
              echo ""
              echo "These files exist in the template but not in this repository:"
              echo ""
              for f in "${NEW_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            if [ "${#SNAPSHOT_CHANGED_FILES[@]}" -gt 0 ]; then
              echo "### Changed Files (Snapshot Mode)"
              echo ""
              echo "These files differ from template, but no baseline ref is configured:"
              echo ""
              for f in "${SNAPSHOT_CHANGED_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            if [ "${#SAFE_ADOPT_FILES[@]}" -gt 0 ]; then
              echo "### Safe Adopt Candidates"
              echo ""
              echo "Template changed since baseline and local file still matches baseline:"
              echo ""
              for f in "${SAFE_ADOPT_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            if [ "${#AUTO_MERGE_FILES[@]}" -gt 0 ]; then
              echo "### Auto-Merge Candidates"
              echo ""
              echo "Both local and template changed since baseline, but a clean 3-way merge is likely:"
              echo ""
              for f in "${AUTO_MERGE_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            if [ "${#CONFLICT_FILES[@]}" -gt 0 ]; then
              echo "### Manual Review Conflicts"
              echo ""
              echo "Both local and template changed since baseline with overlapping edits:"
              echo ""
              for f in "${CONFLICT_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            if [ "${#LOCAL_DIVERGENCE_FILES[@]}" -gt 0 ]; then
              echo "### Local Divergence (Likely Intentional)"
              echo ""
              echo "Local changed since baseline while template remained unchanged:"
              echo ""
              for f in "${LOCAL_DIVERGENCE_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            if [ "${#NEEDS_REBASELINE_FILES[@]}" -gt 0 ]; then
              echo "### Baseline Gap (Needs Rebaseline)"
              echo ""
              echo "No baseline version exists for these paths; review manually and update baseline_ref:"
              echo ""
              for f in "${NEEDS_REBASELINE_FILES[@]}"; do
                echo "- \`${f}\`"
              done
              echo ""
            fi

            echo "---"
            echo ""
            echo "**Summary**: ${TOTAL_DIFFS} difference(s) found."
            echo ""
            echo "- New in template: ${#NEW_FILES[@]}"
            echo "- Snapshot changed (no baseline): ${#SNAPSHOT_CHANGED_FILES[@]}"
            echo "- Safe adopt candidates: ${#SAFE_ADOPT_FILES[@]}"
            echo "- Auto-merge candidates: ${#AUTO_MERGE_FILES[@]}"
            echo "- Manual conflicts: ${#CONFLICT_FILES[@]}"
            echo "- Local divergence: ${#LOCAL_DIVERGENCE_FILES[@]}"
            echo "- Baseline gap: ${#NEEDS_REBASELINE_FILES[@]}"
          } > "${REPORT_FILE}"

          echo "report_file=${REPORT_FILE}" >> "${GITHUB_OUTPUT}"
          new_files_json="$(printf '%s\n' "${NEW_FILES[@]}" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          safe_adopt_json="$(printf '%s\n' "${SAFE_ADOPT_FILES[@]}" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          auto_merge_json="$(printf '%s\n' "${AUTO_MERGE_FILES[@]}" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          conflict_json="$(printf '%s\n' "${CONFLICT_FILES[@]}" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          echo "new_files_json=${new_files_json}" >> "${GITHUB_OUTPUT}"
          echo "safe_adopt_files_json=${safe_adopt_json}" >> "${GITHUB_OUTPUT}"
          echo "auto_merge_files_json=${auto_merge_json}" >> "${GITHUB_OUTPUT}"
          echo "conflict_files_json=${conflict_json}" >> "${GITHUB_OUTPUT}"
          if [ "${#CONFLICT_FILES[@]}" -gt 0 ]; then
            echo "has_conflicts=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_conflicts=false" >> "${GITHUB_OUTPUT}"
          fi
          if [ $(( ${#NEW_FILES[@]} + ${#SAFE_ADOPT_FILES[@]} + ${#AUTO_MERGE_FILES[@]} )) -gt 0 ]; then
            echo "has_pr_candidates=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_pr_candidates=false" >> "${GITHUB_OUTPUT}"
          fi

          cat "${REPORT_FILE}"

      - name: Generate AI suggestions for conflict files (advisory)
        if: steps.compare.outputs.has_conflicts == 'true' && inputs.generate_ai_suggestions == true
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          REPORT_FILE: ${{ steps.compare.outputs.report_file }}
          CONFLICT_FILES_JSON: ${{ steps.compare.outputs.conflict_files_json }}
          BASELINE_REF: ${{ steps.config.outputs.baseline_ref }}
          TEMPLATE_REPO: ${{ steps.config.outputs.template_repo }}
          TEMPLATE_REF: ${{ steps.config.outputs.template_ref }}
          AI_MODEL: ${{ inputs.ai_model || 'gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const cp = require('child_process')

            const reportFile = process.env.REPORT_FILE
            const baselineRef = process.env.BASELINE_REF || ''
            const templateRepo = process.env.TEMPLATE_REPO || ''
            const templateRef = process.env.TEMPLATE_REF || ''
            const aiModel = process.env.AI_MODEL || 'gpt-4.1-mini'
            const token = process.env.GITHUB_TOKEN || ''

            let conflictFiles = []
            try {
              conflictFiles = JSON.parse(process.env.CONFLICT_FILES_JSON || '[]')
            } catch {
              conflictFiles = []
            }

            if (!conflictFiles.length) {
              core.info('No conflict files to process for AI suggestions.')
              return
            }

            if (!baselineRef) {
              core.warning('AI suggestions skipped: baseline_ref is not configured.')
              return
            }

            const truncate = (text, max = 6000) => {
              if (!text) return ''
              if (text.length <= max) return text
              return `${text.slice(0, max)}\n\n...<truncated>...`
            }

            const escapeBackticks = text => (text || '').replace(/```/g, '\\\`\\\`\\\`')
            const aiSections = []

            for (const relPath of conflictFiles) {
              try {
                const localPath = `current/${relPath}`
                const upstreamPath = `template/${relPath}`

                const localText = fs.existsSync(localPath) ? fs.readFileSync(localPath, 'utf8') : ''
                const upstreamText = fs.existsSync(upstreamPath) ? fs.readFileSync(upstreamPath, 'utf8') : ''
                const baseText = cp.execFileSync('git', ['-C', 'template', 'show', '--', `${baselineRef}:${relPath}`], {
                  encoding: 'utf8',
                })

                const prompt = [
                  'You are helping maintain a repository derived from a template.',
                  'Propose an ADVISORY merge strategy for the conflict file below.',
                  'Return markdown with exactly these headings:',
                  '1) Recommendation',
                  '2) Why',
                  '3) Suggested Patch (unified diff, if feasible)',
                  '4) Validation Checklist',
                  '',
                  `Template repo: ${templateRepo} @ ${templateRef}`,
                  `Baseline ref: ${baselineRef}`,
                  `File: ${relPath}`,
                  '',
                  'BASE VERSION:',
                  truncate(baseText),
                  '',
                  'UPSTREAM TEMPLATE VERSION:',
                  truncate(upstreamText),
                  '',
                  'LOCAL DERIVED REPO VERSION:',
                  truncate(localText),
                ].join('\n')

                const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`,
                  },
                  body: JSON.stringify({
                    model: aiModel,
                    temperature: 0.1,
                    max_tokens: 900,
                    messages: [
                      {
                        role: 'system',
                        content:
                          'You generate cautious, review-first merge guidance for repository template drift resolution. Never claim to have applied changes. Keep output concise and actionable.',
                      },
                      { role: 'user', content: prompt },
                    ],
                  }),
                })

                if (!response.ok) {
                  throw new Error(`Model API HTTP ${response.status}`)
                }

                const payload = await response.json()
                const suggestion =
                  payload?.choices?.[0]?.message?.content ||
                  'No suggestion returned by model.'

                aiSections.push(`### AI Suggestion: \`${relPath}\`\n\n${escapeBackticks(suggestion)}\n`)
              } catch (error) {
                core.warning(`AI suggestion failed for ${relPath}: ${error.message}`)
                aiSections.push(
                  [
                    `### AI Suggestion: \`${relPath}\``,
                    '',
                    `- Unable to generate suggestion automatically: ${error.message}`,
                    '- Review this file manually using the 3-way conflict classification.',
                    '',
                  ].join('\n')
                )
              }
            }

            if (!aiSections.length) {
              core.info('No AI sections generated.')
              return
            }

            const appendix = [
              '',
              '---',
              '',
              '## AI-Assisted Conflict Suggestions (Advisory)',
              '',
              '> [!IMPORTANT]',
              '> AI suggestions are advisory only. Validate each recommendation before applying.',
              '',
              ...aiSections,
            ].join('\n')

            fs.appendFileSync(reportFile, appendix)
            core.info(`Appended AI suggestions to ${reportFile}`)

      - name: Ensure template-sync label exists
        if: steps.compare.outputs.has_changes == 'true' && inputs.create_issue != false
        uses: actions/github-script@v9
        with:
          script: |
            const labelDef = {
              name: 'template-sync',
              color: '0075ca',
              description: 'Template drift detected - review upstream changes',
            }
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelDef.name,
              })
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...labelDef,
                })
                core.info(`Created label: ${labelDef.name}`)
              } else {
                throw e
              }
            }

      - name: Create or update tracking issue
        if: steps.compare.outputs.has_changes == 'true' && inputs.create_issue != false
        uses: actions/github-script@v9
        env:
          REPORT_FILE: ${{ steps.compare.outputs.report_file }}
        with:
          script: |
            const fs = require('fs')
            const reportFile = process.env.REPORT_FILE
            const report = fs.readFileSync(reportFile, 'utf8')

            const title = 'chore: template drift detected - review upstream template changes'

            // Find any existing open template-sync tracking issue.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'template-sync',
              per_page: 100,
            })

            const openIssue = existing.find(i => !i.pull_request)

            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body: report,
              })
              core.info(`Updated existing issue #${openIssue.number} with new drift report`)
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: report,
                labels: ['template-sync'],
              })
              core.info(`Created new tracking issue #${created.number}: ${created.html_url}`)
            }

  # PREREQUISITE: Repository must have "Allow GitHub Actions to create and approve pull requests"
  # enabled in Settings > Actions > General > Workflow permissions, or this job will fail to create PRs.
  # This setting cannot be automated; it must be enabled manually in each derived repository.
  create-sync-pr:
    needs: check-template-updates
    if: needs.check-template-updates.outputs.has_pr_candidates == 'true' && inputs.create_sync_pr == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: current

      - name: Checkout template repository
        uses: actions/checkout@v7
        env:
          TEMPLATE_SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        with:
          repository: ${{ needs.check-template-updates.outputs.template_repo }}
          ref: ${{ needs.check-template-updates.outputs.template_ref }}
          fetch-depth: 0
          path: template
          token: ${{ env.TEMPLATE_SYNC_TOKEN != '' && env.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: Prepare sync candidate patch
        id: prepare_sync_patch
        env:
          BASELINE_REF: ${{ needs.check-template-updates.outputs.baseline_ref }}
          NEW_FILES_JSON: ${{ needs.check-template-updates.outputs.new_files_json }}
          SAFE_ADOPT_FILES_JSON: ${{ needs.check-template-updates.outputs.safe_adopt_files_json }}
          AUTO_MERGE_FILES_JSON: ${{ needs.check-template-updates.outputs.auto_merge_files_json }}
        run: |
          set -euo pipefail

          if [ -z "${BASELINE_REF}" ]; then
            echo "No baseline_ref configured. Cannot prepare auto-merge candidates."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          base_ref = os.environ.get('BASELINE_REF', '').strip()
          new_files = json.loads(os.environ.get('NEW_FILES_JSON', '[]'))
          safe_files = json.loads(os.environ.get('SAFE_ADOPT_FILES_JSON', '[]'))
          auto_files = json.loads(os.environ.get('AUTO_MERGE_FILES_JSON', '[]'))

          root = pathlib.Path.cwd()
          current_root = root / 'current'
          template_root = root / 'template'

          def run(cmd, cwd=None, check=True):
            return subprocess.run(cmd, cwd=cwd, check=check, text=True, capture_output=True)

          def read_base(path):
            result = run(['git', '-C', str(template_root), 'show', '--', f'{base_ref}:{path}'])
            return result.stdout

          applied = {'new': [], 'safe': [], 'auto': []}

          for rel in new_files:
            src = template_root / rel
            dst = current_root / rel
            if not src.exists() or not src.is_file():
              continue
            dst.parent.mkdir(parents=True, exist_ok=True)
            dst.write_bytes(src.read_bytes())
            applied['new'].append(rel)

          for rel in safe_files:
            src = template_root / rel
            dst = current_root / rel
            if not src.exists() or not src.is_file():
              continue
            dst.parent.mkdir(parents=True, exist_ok=True)
            dst.write_bytes(src.read_bytes())
            applied['safe'].append(rel)

          for rel in auto_files:
            local = current_root / rel
            upstream = template_root / rel
            if not local.exists() or not upstream.exists():
              continue

            base_content = read_base(rel)
            merge_dir = pathlib.Path(subprocess.run(['mktemp', '-d'], check=True, text=True, capture_output=True).stdout.strip())
            try:
              base_file = merge_dir / 'base'
              local_file = merge_dir / 'local'
              upstream_file = merge_dir / 'upstream'
              merged_file = merge_dir / 'merged'

              base_file.write_text(base_content, encoding='utf-8')
              local_file.write_bytes(local.read_bytes())
              upstream_file.write_bytes(upstream.read_bytes())

              merge = subprocess.run(
                ['git', 'merge-file', '-p', str(local_file), str(base_file), str(upstream_file)],
                check=False,
                text=True,
                capture_output=True,
              )

              if merge.returncode != 0:
                continue

              merged_file.write_text(merge.stdout, encoding='utf-8')
              local.write_bytes(merged_file.read_bytes())
              applied['auto'].append(rel)
            finally:
              subprocess.run(['rm', '-rf', str(merge_dir)], check=False)

          summary_path = current_root / '.tmp' / 'template-sync-pr-summary.md'
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_lines = [
            '## Automated Template Sync Proposal',
            '',
            'This draft PR includes only low-risk categories from check-template-updates:',
            '',
            f'- New template files applied: {len(applied["new"])}',
            f'- Safe adopt candidates applied: {len(applied["safe"])}',
            f'- Auto-merge candidates applied: {len(applied["auto"])}',
            '',
            '### Applied Files',
            '',
          ]

          if applied['new']:
            summary_lines.append('#### New Template Files')
            for item in applied['new']:
              summary_lines.append(f'- `{item}`')
            summary_lines.append('')

          if applied['safe']:
            summary_lines.append('#### Safe Adopt')
            for item in applied['safe']:
              summary_lines.append(f'- `{item}`')
            summary_lines.append('')

          if applied['auto']:
            summary_lines.append('#### Auto-Merge')
            for item in applied['auto']:
              summary_lines.append(f'- `{item}`')
            summary_lines.append('')

          summary_lines.extend([
            '> [!IMPORTANT]',
            '> Review all changes before merge. Manual-conflict files are intentionally excluded.',
            '',
          ])

          summary_path.write_text('\n'.join(summary_lines), encoding='utf-8')
          print(f'Wrote summary to {summary_path}')
          PY

          if git -C current diff --quiet; then
            echo "has_sync_patch=false" >> "${GITHUB_OUTPUT}"
            echo "No file changes produced by sync candidate preparation; skipping draft PR creation."
          else
            echo "has_sync_patch=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update draft sync PR
        if: steps.prepare_sync_patch.outputs.has_sync_patch == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: current
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/template-sync-auto-adopt
          delete-branch: true
          title: 'chore(template-sync): apply safe and auto-merge template updates'
          commit-message: 'chore(template-sync): apply safe and auto-merge template updates'
          body-path: current/.tmp/template-sync-pr-summary.md
          draft: true
          labels: |
            template-sync
