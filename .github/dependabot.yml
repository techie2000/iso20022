version: 2
updates:
  # npm dependencies in root package.json
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - ci
    commit-message:
      prefix: "chore(ci):"
      include: "scope"
