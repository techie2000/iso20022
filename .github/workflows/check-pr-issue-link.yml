name: Check PR Issue Link

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

env:
  ISSUE_LINK_ENFORCEMENT_MODE: advisory

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue linkage or approved override
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            const actor = pr.user.login

            function isIntegrationPermissionError(error) {
              return (
                error?.status === 403 &&
                /resource not accessible by integration/i.test(String(error?.message || error))
              )
            }

            if (pr?.head?.repo?.fork) {
              core.info('Fork PR source detected; skipping issue link check.')
              return
            }

            let enforcementMode = (process.env.ISSUE_LINK_ENFORCEMENT_MODE || 'advisory').toLowerCase()
            try {
              const { data: variable } = await github.request(
                'GET /repos/{owner}/{repo}/actions/variables/{name}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'ISSUE_LINK_ENFORCEMENT_MODE',
                }
              )

              const configuredMode = String(variable?.value || '').trim().toLowerCase()
              if (configuredMode === 'required' || configuredMode === 'advisory') {
                enforcementMode = configuredMode
              }
            } catch (error) {
              if (error?.status !== 404) {
                core.warning(`Unable to read ISSUE_LINK_ENFORCEMENT_MODE variable; using '${enforcementMode}'.`)
              }
            }

            // Bot-authored PRs are exempt.
            if (actor.endsWith('[bot]') || actor === 'dependabot') {
              core.info('Bot PR detected; skipping issue link check.')
              return
            }

            const prLabels = (pr.labels || []).map((l) => (typeof l === 'string' ? l : l.name))
            if (prLabels.includes('no-issue-needed')) {
              core.info('no-issue-needed label present; skipping issue link check.')
              return
            }

            const body = pr.body || ''
            const bodyWithoutHtmlComments = body.replace(/<!--[\s\S]*?-->/g, ' ')
            const hasIssueReferenceKeyword = /\b(closes?|fixes?|resolves?|refs?|relates?\s+to)(?:\s+|:\s*)#\d+/i.test(body)
            const hasCloseOnMergeKeyword = /\b(closes?|fixes?|resolves?)(?:\s+|:\s*)#\d+/i.test(body)
            const keepOpenChecked = /- \[x\] keep linked issue\(s\) open\s*-\s*reason\s*:\s*\S+/i.test(bodyWithoutHtmlComments)

            // Guardrail: closing keywords must target issues, not pull requests.
            const closingKeywordMatches = [...body.matchAll(/\b(closes?|fixes?|resolves?)(?:\s+|:\s*)#(\d+)\b/gi)]
            const closingTargets = [...new Set(closingKeywordMatches.map((m) => Number(m[2])))]
            const closingTargetsThatArePRs = []

            for (const targetNumber of closingTargets) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: targetNumber,
                })

                if (issue?.data?.pull_request) {
                  closingTargetsThatArePRs.push(targetNumber)
                }
              } catch (error) {
                const status = error?.status
                const details = status ? `status ${status}` : String(error)

                if (
                  status === 403 &&
                  /Resource not accessible by integration/i.test(String(error?.message || error))
                ) {
                  core.warning(
                    `Skipping verification of closing keyword target #${targetNumber} (${details}) due to token restrictions.`
                  )
                  continue
                }

                core.setFailed(
                  `Unable to verify closing keyword target #${targetNumber} (${details}). ` +
                    'Do not use Closes/Fixes/Resolves until target verification succeeds.'
                )
                return
              }
            }

            if (closingTargetsThatArePRs.length > 0) {
              const list = closingTargetsThatArePRs.map((n) => `#${n}`).join(', ')
              core.setFailed(
                `Invalid closing keyword target: ${list} is a pull request. ` +
                  'Use Refs #N for PR references, or use Closes/Fixes #N only for issues.'
              )
              return
            }

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50) {
                      totalCount
                    }
                  }
                }
              }
            `

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number,
            })

            const linkedIssueCount =
              result?.repository?.pullRequest?.closingIssuesReferences?.totalCount || 0
            const hasLinkedClosingIssue = linkedIssueCount > 0
            const noIssueChecked = /- \[x\] no linked issue\s*-\s*reason\s*:\s*\S+/i.test(body)

            const hasLinkedIssueReference = hasIssueReferenceKeyword || hasLinkedClosingIssue

            if (hasLinkedIssueReference && !hasCloseOnMergeKeyword && !keepOpenChecked) {
              if (enforcementMode === 'required') {
                core.setFailed(
                  'Linked issue detected but closure intent is missing. Add Closes/Fixes #N for issues to close on merge, or check "Keep linked issue(s) open" with a reason.'
                )
                return
              }

              let alreadyWarnedAboutClosureIntent = false
              let pageForClosureIntent = 1
              let hasMoreClosureIntent = true
              while (hasMoreClosureIntent && !alreadyWarnedAboutClosureIntent) {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  page: pageForClosureIntent,
                  per_page: 50,
                })

                alreadyWarnedAboutClosureIntent = comments.some(
                  (c) =>
                    c.user.login === 'github-actions[bot]' &&
                    c.body.includes('<!-- pr-issue-closure-intent-advisory -->')
                )

                hasMoreClosureIntent = comments.length === 50
                pageForClosureIntent += 1
              }

              if (!alreadyWarnedAboutClosureIntent) {
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: [
                      '<!-- pr-issue-closure-intent-advisory -->',
                      '> [!TIP]',
                      '> This PR links one or more issues but does not specify whether those issues should close on merge.',
                      '> Add `Closes #N` / `Fixes #N` for issues that should auto-close, or check `Keep linked issue(s) open` with a reason.'
                    ].join('\n'),
                  })
                } catch (error) {
                  if (isIntegrationPermissionError(error)) {
                    core.warning('Unable to post closure-intent advisory due to token restrictions; continuing in advisory mode.')
                  } else {
                    throw error
                  }
                }
              }
            }

            if (hasIssueReferenceKeyword || hasLinkedClosingIssue || noIssueChecked) {
              core.info('Issue link or override found.')
              return
            }

            if (enforcementMode === 'required') {
              core.setFailed(
                'Missing linked issue reference. Add Refs #N (preferred), Closes/Fixes #N (issues only), or check "No linked issue" with a reason.'
              )
              return
            }

            let alreadyAdvised = false
            let page = 1
            let hasMore = true
            while (hasMore && !alreadyAdvised) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                page,
                per_page: 50,
              })
              alreadyAdvised = comments.some(
                (c) =>
                  c.user.login === 'github-actions[bot]' &&
                  c.body.includes('<!-- pr-issue-link-advisory -->')
              )
              hasMore = comments.length === 50
              page += 1
            }

            if (alreadyAdvised) {
              core.info('Advisory already posted.')
              return
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  '<!-- pr-issue-link-advisory -->',
                  '> [!TIP]',
                  '> This PR does not appear to reference a linked issue.',
                  '> If one exists, add an issue reference in the PR description, for example:',
                  '> Refs #123 (preferred)',
                  '> Closes #123 (issue only; do not use for pull requests)',
                  '>',
                  '> If this PR does not need a backing issue, check the No linked issue box and add a brief reason.'
                ].join('\n'),
              })
            } catch (error) {
              if (isIntegrationPermissionError(error)) {
                core.warning('Unable to post advisory comment due to token restrictions; continuing in advisory mode.')
                return
              }
              throw error
            }

            core.info(`Advisory comment posted on PR #${pr.number}`)
