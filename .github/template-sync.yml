# Template sync metadata for baseline-aware drift analysis.
#
# PREREQUISITE for automated PR creation:
# Ensure your derived repository has enabled:
#   Settings > Actions > General > Workflow permissions >
#   "Allow GitHub Actions to create and approve pull requests"
# (This setting cannot be enabled programmatically; manual setup required.)
#
# baseline_ref should be set in each derived repository to the template commit
# used to create (or last re-baseline) that repository.
#
# Example:
#   baseline_ref: "a1b2c3d4e5f6..."
#
# If baseline_ref is blank, check-template-updates falls back to snapshot mode.
# comparison_exclude_paths should be a comma-separated list of repo-relative
# files/folders to skip when a derived repository has a truly local-only
# surface that should never be compared.
template_repo: "techie2000/template-docs"
template_ref: "main"
baseline_ref: ""
comparison_exclude_paths: ""
